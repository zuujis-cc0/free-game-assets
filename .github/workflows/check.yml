# Runs scripts/check.py (file types, sizes, damaged files, licences, broken links) on every push and pull request.
# Only actions published by GitHub itself, pinned by commit; read-only token.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the collection
        run: python3 scripts/check.py
